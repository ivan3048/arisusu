<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        
        /* Header Arienzo */
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: #fff; border-bottom: 1px solid #eee; position: relative; }
        .logo { font-weight: bold; font-size: 1.5rem; color: #333; }
        
        /* Botón de menú hamburguesa */
        .menu-btn { cursor: pointer; font-size: 1.8rem; font-weight: bold; }

        /* Barra lateral (Sidebar) */
        .sidebar { height: 100%; width: 0; position: fixed; z-index: 100; top: 0; right: 0; background: #fff; overflow-x: hidden; transition: 0.3s; border-left: 1px solid #eee; padding-top: 60px; box-shadow: -2px 0 5px rgba(0,0,0,0.1); }
        .sidebar .close-btn { position: absolute; top: 20px; left: 20px; font-size: 2rem; cursor: pointer; color: #333; }
        .sidebar a { display: block; padding: 20px 40px; text-decoration: none; color: #333; font-size: 1.2rem; transition: 0.2s; }
        .sidebar a:hover { background: #f9f9f9; }

        /* Hero */
        .hero { height: 80vh; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('fondo.jpg'); background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; padding: 0 10%; }
        .hero-tag { background: #d4af37; padding: 5px 10px; font-size: 0.8rem; margin-bottom: 15px; }
        .hero h1 { font-size: 3rem; margin-bottom: 20px; }
        .btn-catalogo { padding: 15px 40px; background: #d4af37; color: white; border: none; cursor: pointer; font-weight: bold; }

        /* Promoción */
        .promo-banner { background-color: #f5f0e1; padding: 40px 8%; color: #333; display: flex; justify-content: space-between; align-items: center; }

        /* Carrusel 60vh */
        .full-hero-slider { height: 60vh; position: relative; overflow: hidden; }
        .slide { height: 100%; width: 100%; position: absolute; top: 0; left: 0; background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; opacity: 0; transition: opacity 1s ease-in-out; padding: 0 10%; }
        .slide.active { opacity: 1; }
        .slide h1 { font-size: 2.5rem; margin-bottom: 15px; }
        .prev, .next { position: absolute; top: 50%; background: rgba(255,255,255,0.2); color: white; border: none; padding: 15px; cursor: pointer; z-index: 2; }
        .prev { left: 20px; } .next { right: 20px; }
    </style>
</head>
<body>

<header>
    <div class="logo">Arienzo</div>
    <div class="menu-btn" onclick="openSidebar()">☰</div>
</header>

<div id="sidebar" class="sidebar">
    <div class="close-btn" onclick="closeSidebar()">&times;</div>
    <a href="index.html">INICIO</a>
    <a href="carrito.html">Carrito</a>
</div>

<section class="hero">
    <div class="hero-tag">ENDULZANDO TUS MOMENTOS DESDE 2010</div>
    <h1>El Placer De Compartir Un Postre Inolvidable.</h1>
</section>

<script>
    function openSidebar() { document.getElementById("sidebar").style.width = "250px"; }
    function closeSidebar() { document.getElementById("sidebar").style.width = "0"; }
</script>

</body>
</html>
