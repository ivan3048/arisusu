<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bigote - Arienzo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        
        /* Header Arienzo */
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: #fff; border-bottom: 1px solid #eee; }
        .logo { font-weight: bold; font-size: 1.5rem; color: #333; }
        nav { display: flex; gap: 30px; align-items: center; }
        .nav-link { text-decoration: none; color: #333; font-size: 0.9rem; cursor: pointer; }

        /* Estilos página producto */
        .product-page { display: flex; padding: 50px 8%; gap: 50px; }
        .gallery { flex: 1; }
        .main-image { width: 100%; border: 1px solid #ddd; margin-bottom: 15px; }
        .thumbnails { display: flex; gap: 10px; }
        .thumbnails img { width: 80px; height: 80px; cursor: pointer; border: 1px solid #ddd; }
        
        .product-info { flex: 1; }
        .product-info h1 { font-size: 2.5rem; color: #333; margin-bottom: 10px; }
        .price { font-size: 1.5rem; color: #333; margin-bottom: 20px; }
        .description { line-height: 1.6; color: #555; margin-bottom: 30px; }
        
        .cart-form { display: flex; gap: 10px; align-items: center; }
        .qty-input { width: 50px; padding: 10px; border: 1px solid #ddd; }
        .btn-add-cart { padding: 10px 20px; background: #d4af37; color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn-add-cart:hover { background-color: #b8962f; }
    </style>
</head>
<body>

<header>
    <div class="logo">Arienzo</div>
    <nav>
        <a href="index.html" class="nav-link">INICIO</a>
        <a href="carrito.html" class="nav-link">Carrito</a>
    </nav>
</header>

<main class="product-page">
    <div class="gallery">
        <!-- Imagen referenciada de image_da7348.jpg -->
        <img src="bigote.png" alt="Bigote" class="main-image">
        <div class="thumbnails">
            <img src="bigote1.png" alt="Vista 1">
            <img src="bigote2.png" alt="Vista 2">        </div>
    </div>

    <div class="product-info">
        <h1>Bigote</h1>
        <p class="price">$30.00</p>
        <p class="description">
            Esponjoso, tradicional y con el toque justo de dulzura. Nuestro <b>Bigote con Azúcar</b> 
            es el compañero perfecto para tu café de la mañana o ese antojo especial de la tarde. 
            Un clásico que nunca falla.
        </p>
        
        <div class="cart-form">
            <input type="number" value="1" min="1" class="qty-input" id="cantidad">
            <button class="btn-add-cart" id="btn-add" data-nombre="Bigote" data-precio="30.00">Añadir al carrito</button>
        </div>
        <p style="margin-top: 20px; font-size: 0.9rem; color: #888;">Categoría: pan</p>
    </div>
</main>

<script>
    document.getElementById('btn-add').addEventListener('click', function() {
        const nombre = this.getAttribute('data-nombre');
        const precio = this.getAttribute('data-precio');
        const cantidad = document.getElementById('cantidad').value;

        let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
        carrito.push({ nombre, precio, cantidad });
        localStorage.setItem('carrito', JSON.stringify(carrito));

        alert(nombre + " ha sido añadido al carrito (" + cantidad + " unidad/es).");
    });
</script>

</body>
</html>
