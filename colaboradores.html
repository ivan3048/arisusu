<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colaboradores - Arienzo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #f9f9f9; color: #333; line-height: 1.6; }
        
        /* Header minimalista */
        header { background: #fff; padding: 20px 8%; border-bottom: 1px solid #eee; text-align: center; }
        .logo { font-weight: bold; font-size: 1.5rem; color: #5d4037; }

        /* Contenido */
        .main-container { max-width: 800px; margin: 50px auto; padding: 0 20px; text-align: center; }
        h1 { color: #5d4037; margin-bottom: 30px; }
        
        .colaboradores-lista { list-style: none; padding: 0; }
        .colaborador-item { 
            background: #fff; 
            margin-bottom: 15px; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-size: 1.2rem;
            font-weight: 500;
        }

        .back-btn { 
            display: inline-block; 
            margin-top: 30px; 
            padding: 10px 25px; 
            background: #d4af37; 
            color: #fff; 
            text-decoration: none; 
            border-radius: 4px; 
        }
    </style>
</head>
<body>

<header>
    <div class="logo">Arienzo</div>
</header>

<main class="main-container">
    <h1>Nuestros Colaboradores</h1>
    
    <ul class="colaboradores-lista">
        <li class="colaborador-item">Mondragon Cortez Maria Fernanda</li>
        <li class="colaborador-item">Loperena Ramirez Angelo Alexander</li>
        <li class="colaborador-item">Prieto Martin del campo Salvador</li>
        <li class="colaborador-item">Ruvalcaba Rodriguez Maria Guadalupe</li>
        <li class="colaborador-item">Patricio Alessandro Zamora Fernandez</li>
    </ul>

    <a href="index.html" class="back-btn">Volver al Inicio</a>
</main>

</body>
</html>
